services:
  jenkins:
    image: jenkins/jenkins:lts
    container_name: jenkins
    user: root

    ports:
      - "8080:8080"   # Jenkins UI
      - "50000:50000" # inbound agents (optional)
      - "8081:8081"   # ynet app
      - "9091:9091"   # cadvisor
      - "3001:3001"   # grafana
      - "8082:8082"   # node-exporter
    volumes:
      - ./jenkins_home:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock  # let Jenkins talk to Docker on the host
    restart: unless-stopped
