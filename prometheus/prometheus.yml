global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  # Prometheus itself
  - job_name: 'prometheus'
    static_configs:
      - targets: ['prometheus:9090']

  # cAdvisor -> container CPU/memory/FS/Net
  - job_name: 'cadvisor'
    static_configs:
      - targets: ['cadvisor:8081']

  # Node exporter (host metrics) — only if you enabled it without host networking:
  # - job_name: 'node-exporter'
  #   static_configs:
  #     - targets: ['node-exporter:9100']
